[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "struct2circuit"
version = "0.1.0"
description = "Verified structure-conditioned mixers for cardinality-constrained quantum optimization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

